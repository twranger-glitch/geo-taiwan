<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>臺史博尋寶任務｜海佃地圖</title>
<meta name="description" content="跟著國立臺灣歷史博物館常設展「斯土斯民」的 7 個展區，找證據、想原因、集印章。教室和博物館現場都能玩。">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a field-survey notebook — sticky unit rail on top, each unit a full-width band with a map/instrument on one side and a reading card on the other */
:root{
  --paper:#e9f0ef; --surface:#ffffff; --surface-2:#f4f8f7;
  --ink:#10313b; --muted:#557079; --line:#cad8d8;
  --sea:#cfe4e7; --sea-deep:#0f3644; --land:#b8c79f; --land-ink:#7d9468;
  --typhoon:#d9462b; --plate:#d8901a; --wind:#2a86b8; --rain:#3a9fb5; --leaf:#4f8a4a;
  --cat1:#3B8EDB; --cat2:#E69F00; --cat3:#B2182B;
  --conv:#D55E00; --div:#0098A6; --trans:#C79100;
  --shadow:0 1px 2px rgba(16,49,59,.06),0 8px 24px rgba(16,49,59,.07);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b191e; --surface:#11252c; --surface-2:#0e2026;
  --ink:#e2eef0; --muted:#8ca6ad; --line:#24414a;
  --sea:#123542; --sea-deep:#0a2630; --land:#3d5a45; --land-ink:#6f9174;
  --typhoon:#ff7155; --plate:#f2b042; --wind:#5cb6e6; --rain:#5cc3d6; --leaf:#7cc070;
  --cat1:#7CC0FF; --cat2:#F2B942; --cat3:#FF6B81;
  --conv:#ff7155; --div:#3fd0c8; --trans:#f2b942;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b191e; --surface:#11252c; --surface-2:#0e2026;
  --ink:#e2eef0; --muted:#8ca6ad; --line:#24414a;
  --sea:#123542; --sea-deep:#0a2630; --land:#3d5a45; --land-ink:#6f9174;
  --typhoon:#ff7155; --plate:#f2b042; --wind:#5cb6e6; --rain:#5cc3d6; --leaf:#7cc070;
  --cat1:#7CC0FF; --cat2:#F2B942; --cat3:#FF6B81;
  --conv:#ff7155; --div:#3fd0c8; --trans:#f2b942;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wind);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Header */
header.top{padding-block:28px 18px;position:relative;overflow:hidden}
.top .wrap{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.kicker{font-size:15.5px;letter-spacing:.12em;color:var(--muted);font-weight:500}
h1{font-size:clamp(30px,5vw,48px);margin-top:4px}
h1 .accent{color:var(--typhoon)}
.lede{max-width:40em;color:var(--muted);margin-top:8px}
.coord{font-family:var(--f-num);font-size:14.5px;color:var(--muted);text-align:right;line-height:1.6;white-space:nowrap}
.contour{position:absolute;inset:0;pointer-events:none;opacity:.5}
.contour path{fill:none;stroke:var(--line);stroke-width:1}

/* Rail */
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.rail .wrap::-webkit-scrollbar{display:none}
.rail a{flex:none;text-decoration:none;color:var(--ink);font-size:17px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;gap:6px;align-items:center;transition:background .2s,border-color .2s}
.rail a:hover{border-color:var(--ink)}
.rail a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rail .dot{width:8px;height:8px;border-radius:50%}

/* Sections */
section.unit{padding-block:56px 36px;border-bottom:1px solid var(--line);scroll-margin-top:60px}
.unit-head{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;margin-bottom:24px}
.badge{grid-row:span 2;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:26px}
.unit-head h2{font-size:clamp(24px,3.4vw,32px)}
.unit-head .sub{color:var(--muted);max-width:46em}
.page-ref{display:inline-block;font-family:var(--f-num);font-size:14.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:8px;color:var(--muted);vertical-align:middle;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.grid2.rev{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
@media (max-width:860px){.grid2,.grid2.rev{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.panel.pad{padding:20px 22px}
.stage{position:relative;min-width:0}
.card h3{font-size:22px}
.card .meta{font-size:15.5px;color:var(--muted);margin-top:2px}
.card p+p{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:17px;display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .sw{width:14px;height:4px;border-radius:2px;display:inline-block}
.chip[data-l="div"] .sw{background:repeating-linear-gradient(90deg,var(--div) 0 6px,transparent 6px 9px) !important;width:22px}
.chip[data-l="trans"] .sw{background:repeating-linear-gradient(90deg,var(--trans) 0 2px,transparent 2px 6px) !important;width:22px}
.chip[data-l="conv"] .sw{width:22px;height:5px}
.label{font-size:14.5px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.think{border-left:4px solid var(--plate);background:var(--surface-2);padding:12px 16px;border-radius:0 12px 12px 0;font-size:18px}
.think b{font-family:var(--f-display);font-weight:400;color:var(--plate)}
.note{font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:14.5px;color:var(--muted)}
.stat .v{font-weight:700;font-size:18px;line-height:1.45}
.tag{display:inline-block;font-size:14.5px;font-weight:700;border-radius:6px;padding:1px 8px;color:#fff}

/* Globe */
.globe-box{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--sea-deep) 40%,var(--paper)) 0%,var(--paper) 70%);border-radius:24px;padding:8px;position:relative}
#globe{width:100%;height:auto;display:block;touch-action:none;cursor:grab;max-width:640px;margin:0 auto}
#globe:active{cursor:grabbing}
.g-sea{fill:var(--sea-deep)}
.g-grat{fill:none;stroke:#ffffff;stroke-opacity:.08;stroke-width:.6}
.g-land{fill:#7fa27c;stroke:#c9dcc0;stroke-width:.5;stroke-opacity:.7}
.g-lake{fill:#0f3644}
.g-b{cursor:pointer}
.g-tw{fill:#e7c66d;stroke:#fff;stroke-width:.6}
.g-b{fill:none;stroke-linecap:round;stroke-linejoin:round}
.g-b.conv{stroke:#ff6a4d;stroke-width:2.6}
.g-poly{fill-opacity:.34;stroke:#ffffff;stroke-opacity:.45;stroke-width:.8}
.g-b.hand{opacity:.5}
.g-b.div{stroke:#4fe0d6;stroke-width:2.2;stroke-dasharray:6 4}
.g-b.trans{stroke:#ffc23d;stroke-width:2.2;stroke-dasharray:1 5}
.g-b.hl{stroke-width:5}
.g-plate{font-family:var(--f-display);font-size:18px;fill:#ffffff;fill-opacity:.85;paint-order:stroke;stroke:#0a2630;stroke-width:3px;cursor:pointer;text-anchor:middle}
.g-plate:hover{fill:#ffd36b;fill-opacity:1}
.g-eq{fill:#ff5a3c;fill-opacity:.75;stroke:#fff;stroke-width:1;cursor:pointer}
.g-eq.sel{fill:#ffd23d;fill-opacity:1;stroke-width:2}
.g-eq-pulse{fill:none;stroke:#ffd23d;stroke-width:2;pointer-events:none}
.g-mt{fill:#ffd36b;stroke:#3b2a05;stroke-width:1;cursor:pointer}
.g-mt.sel{fill:#fff}
.g-halo{fill:url(#halo);pointer-events:none}
.globe-tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1;box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.globe-hint{position:absolute;left:16px;bottom:12px;font-size:14.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 10px;border-radius:999px}
.legend-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mag-scale{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted)}

/* Profile */
#profile{width:100%;height:auto;display:block}
.pf-zone{cursor:pointer}
.pf-zone .hit{fill:transparent}
.pf-zone:hover .hit,.pf-zone.on .hit{fill:var(--ink);fill-opacity:.06}
.pf-zone text{font-family:var(--f-display);font-size:18px;fill:var(--ink);text-anchor:middle}
.pf-zone.on text{fill:var(--typhoon)}
.pf-ground{fill:var(--land);stroke:var(--land-ink);stroke-width:1.5}
.pf-sea{fill:var(--sea)}
.pf-plate-eu{fill:color-mix(in srgb,var(--plate) 30%,var(--surface))}
.pf-plate-ph{fill:color-mix(in srgb,var(--typhoon) 22%,var(--surface))}
.pf-txt{font-size:15.5px;fill:var(--muted)}
.pf-txt.b{fill:var(--ink);font-weight:700}

/* Typhoon */
.ty-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.ty-layout{grid-template-columns:minmax(0,1fr)}}
.map-box{background:var(--sea);border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative}
#tymap{width:100%;height:auto;display:block}
.m-land{fill:var(--land);stroke:var(--land-ink);stroke-width:.5}
.m-tw{fill:color-mix(in srgb,var(--land) 70%,var(--plate));stroke:var(--land-ink);stroke-width:.8}
.m-grid{stroke:var(--ink);stroke-opacity:.08;fill:none}
.m-grid-t{font-family:var(--f-num);font-size:14px;fill:var(--muted)}
.m-trop{stroke:#9b59b6;stroke-dasharray:6 4;stroke-width:1.2;fill:none}
.m-trop-t{font-size:14px;fill:#9b59b6}
.trk{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.6;stroke-opacity:.55;transition:opacity .25s}
.trk[data-c="1"]{stroke-width:1.1}.trk[data-c="2"]{stroke-width:2}.trk[data-c="3"]{stroke-width:3;stroke-opacity:.7}
.trk-g{cursor:pointer;transition:opacity .25s}
.trk-g.dim{opacity:.08}
.trk-g.sel .trk{stroke-opacity:1;stroke-width:3.4}
.trk-g .hit{stroke:transparent;stroke-width:12;fill:none}
.tdt{font-family:var(--f-num);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.tnm{font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px}
.ty-legend{position:absolute;left:12px;top:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:12px;padding:8px 12px;font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.ty-legend span{display:flex;align-items:center;gap:6px}
.ty-legend i{width:22px;height:3px;border-radius:2px;display:inline-block}
.ty-legend span:nth-child(1) i{height:5px}.ty-legend span:nth-child(3) i{height:2px}
.ty-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.ty-item{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;transition:all .15s;min-width:0}
.ty-item:hover{border-color:var(--ink)}
.ty-item[aria-pressed="true"]{border-color:var(--typhoon);box-shadow:0 0 0 2px color-mix(in srgb,var(--typhoon) 30%,transparent)}
.ty-item .yr{font-family:var(--f-num);font-size:14.5px;color:var(--muted);grid-column:2}
.ty-item .nm{font-weight:700;grid-column:2;line-height:1.3}
.ty-item .cat{grid-row:1/3;width:10px;height:30px;border-radius:4px}
.spiral{width:42px;height:42px;flex:none}
.spiral.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.ty-card-head{display:flex;gap:12px;align-items:center}
.res-bars{display:grid;gap:6px;margin-top:8px}
.res-row{display:grid;grid-template-columns:56px 1fr 52px;gap:8px;align-items:center;font-size:15.5px}
.res-bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.res-bar i{display:block;height:100%;background:var(--rain);border-radius:5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:999px;font-size:17px;display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

.ty-tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ty-tools select,.ty-tools input{font:inherit;font-size:17px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.ty-tools input{flex:1;min-width:180px}
.g-cty{font-family:var(--f-body);font-size:14px;fill:#f2f7f4;fill-opacity:.9;paint-order:stroke;stroke:#0a2630;stroke-width:2.6px;text-anchor:middle;pointer-events:none}
.g-ocn{font-family:var(--f-display);font-size:17px;fill:#bfe3ea;fill-opacity:.6;font-style:italic;text-anchor:middle;pointer-events:none}
.m-cty{font-family:var(--f-body);font-size:14px;fill:var(--ink);fill-opacity:.7;text-anchor:middle;paint-order:stroke;stroke:var(--sea);stroke-width:2.5px}
.m-ocn{font-family:var(--f-display);font-size:17px;fill:var(--muted);font-style:italic;text-anchor:middle}

/* Monsoon */
#monsoon{width:100%;height:auto;display:block}
.ms-sea{fill:var(--sea)}
.ms-tw{fill:var(--land);stroke:var(--land-ink);stroke-width:1.2}
.ms-mt{fill:color-mix(in srgb,var(--plate) 65%,var(--land));stroke:var(--land-ink);stroke-width:.6}
.ms-wind{fill:none;stroke:var(--wind);stroke-width:3;stroke-linecap:round;stroke-dasharray:14 12;animation:flow 1.2s linear infinite}
.ms-wind.summer{stroke:var(--typhoon)}
@keyframes flow{to{stroke-dashoffset:-26}}
.ms-head{fill:var(--wind)}
.ms-head.summer{fill:var(--typhoon)}
.ms-cloud{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.ms-drop{stroke:var(--rain);stroke-width:2;stroke-linecap:round}
.ms-txt{font-family:var(--f-display);font-size:16px;fill:var(--ink)}
.ms-sm{font-size:14.5px;fill:var(--muted)}
.season-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.season-toggle button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:18px}
.season-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.turbine-card{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
#compass{width:120px;height:120px}
.cmp-ring{fill:var(--surface-2);stroke:var(--line)}
.cmp-t{font-family:var(--f-num);font-size:14px;fill:var(--muted);text-anchor:middle}
.quiz-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qopt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-size:18px}
.qopt.right{background:color-mix(in srgb,var(--leaf) 20%,var(--surface));border-color:var(--leaf)}
.qopt.wrong{background:color-mix(in srgb,var(--typhoon) 15%,var(--surface));border-color:var(--typhoon)}
.qopt.right::after{content:"　✓ 正確答案";font-weight:700;color:var(--leaf);white-space:nowrap}
.qopt.wrong::after{content:"　✗ 你選的";font-weight:700;color:var(--typhoon);white-space:nowrap}
.qopt.wrong{border-style:dashed}
.qfb{margin-top:10px;font-size:18px;min-height:1.5em}
@media (prefers-reduced-motion:reduce){.ms-wind,.spiral.spin{animation:none}}

/* Charts */
.chart{width:100%;height:auto;display:block}
.ax text{font-family:var(--f-num);font-size:14px;fill:var(--muted)}
.ax line,.ax path{stroke:var(--line)}
.gridl{stroke:var(--line);stroke-dasharray:2 4}
.bar-tw{fill:var(--rain);fill-opacity:.45}
.bar-tn{fill:var(--typhoon)}
.band{fill:var(--plate);fill-opacity:.13}
.band-t{font-family:var(--f-display);font-size:15.5px;fill:var(--plate)}
.val{font-family:var(--f-num);font-size:14px;fill:var(--ink);text-anchor:middle}
.ln{fill:none;stroke-width:2.5}
.ln-dot{stroke:var(--surface);stroke-width:1.5}
.cmp-bars{display:grid;gap:8px;margin-top:6px}
.cmp-row{display:grid;grid-template-columns:96px 1fr 80px;gap:10px;align-items:center;font-size:17px}
.cmp-row .tr{height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.cmp-row .tr i{display:block;height:100%;border-radius:8px}

/* Elevation */
#mtn{width:100%;height:auto;display:block}
.mt-sky{fill:var(--surface-2)}
.mt-body{fill:var(--land);stroke:var(--land-ink);stroke-width:1.5}
.mt-snow{fill:var(--surface);opacity:.9}
.mt-line{stroke:var(--typhoon);stroke-width:1.5;stroke-dasharray:5 4}
.mt-pin{fill:var(--typhoon);stroke:var(--surface);stroke-width:2}
.mt-ref{font-size:14.5px;fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.mt-refdot{fill:var(--ink)}
input[type=range]{width:100%;accent-color:var(--typhoon)}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.big{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1.1}
.crop{display:flex;gap:12px;align-items:center;margin-top:12px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.crop-ico{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#fff}

/* Calendar */
.cal{overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:110px repeat(12,minmax(44px,1fr));min-width:700px;gap:0}
.cal-h{font-family:var(--f-num);font-size:14.5px;color:var(--muted);text-align:center;padding:4px 0}
.cal-rain{grid-column:2/-1;display:grid;grid-template-columns:repeat(12,1fr);align-items:end;height:70px;gap:6px;padding:0 6px;border-bottom:1px solid var(--line)}
.cal-rain i{display:block;background:var(--rain);opacity:.4;border-radius:4px 4px 0 0}
.cal-row{display:contents}
.cal-name{font-size:17px;font-weight:700;padding:8px 8px 8px 0;display:flex;align-items:center;border-bottom:1px dashed var(--line)}
.cal-track{grid-column:2/-1;position:relative;border-bottom:1px dashed var(--line);height:44px}

 {t:'choice',q:'第一批來到臺灣的人，從哪裡來？博物館展出兩種說法：一是冰河時期追著動物、從亞洲大陸走過來的獵人；二是從東南亞海上一路往北捕魚的漁夫。為什麼博物館不直接告訴我們答案？',o:['博物館忘了寫','目前的考古證據，還不能確定是哪一種','兩種說法都已經被證明是錯的','這是祕密，只有大人能知道'],a:1,
  no:{0:'展區名稱就叫「第一批臺灣人群之謎」，是故意留下的問題喔。',2:'博物館說兩種說法「都是有可能的」。',3:'歷史不是祕密，是要靠證據慢慢找出來的。'},why:'博物館的說明寫著：考古證據還沒有得出決定性的結論，所以兩種說法都有可能。<b>歷史要靠證據</b>，證據不夠時，就要誠實地說「還不確定」。冰河時期海水下降，臺灣海峽有一部分變成陸地，所以人和動物可以走過來。'}],
 site:{look:'找一件舊石器時代的石器，仔細看它的邊緣。',q:'它的邊緣看起來比較像哪一種？',o:['凹凸不平，有一片一片敲下來的痕跡','光滑平整，像磨過一樣'],a:0,why:'舊石器時代的石器是用石頭互相敲打做成的，叫「打製石器」，所以邊緣凹凸不平。'},
 more:[['史前生存大冒險：舊石器時代','prehistory.html'],['如果海平面上升了（冰河時期海平面）','sealevel.html']]},
{id:'s2',tease:'種田、陶罐和臺灣的玉',zone:'最初的抵岸',sub:'新石器時代：新移民帶來了新科技',url:NM+'df0ea18f-08be-403b-b8fc-f3ca58aa7b67',tour:TOUR1,c:'#009E73',ico:'pot',stamp:'陶',unit:'第三單元 3-1',
 intro:'後來，又有一群人渡海來到臺灣。他們帶來了新的技術：種田、養動物、做陶器、把石器磨得又光又利。博物館說，有了農業，食物比較穩定，人口也增加了。',
 steps:[
 {t:'match',q:'新石器時代的人用這些東西做什麼？幫每一樣找到用途。',L:['磨製石斧','石刀','陶罐','玉耳飾'],R:['砍樹、開墾土地','收割小米','煮東西、裝食物','裝飾，也能表示身分'],a:[0,1,2,3],why:'磨製石器比打製石器更鋒利、更耐用；陶罐可以煮食和儲存糧食；玉器多半是裝飾品，卑南遺址就出土了很多玉器。'},
 {t:'choice',q:'為什麼新石器時代的人可以蓋房子、住下來，不用常常搬家？',o:['因為他們比較喜歡房子','因為會種田、養動物，食物比較穩定','因為野生動物都跑光了','因為政府規定要住在一起'],a:1,no:{0:'喜歡不夠喔，還要有吃的才能留下來。',2:'他們仍然會打獵和捕魚。',3:'那時候還沒有政府。'},why:'會種田、養動物以後，不必跟著獵物到處跑，食物也存得住（陶罐！），所以可以定居，慢慢形成聚落。'},
 {t:'choice',q:'考古學家在東南亞許多遺址，都找到用「臺灣的玉」做成的飾品。這代表什麼？',o:['東南亞的人偷了臺灣的玉','史前時代住在臺灣的人，就已經和島外有跨海交流','臺灣的玉是後來的人帶過去的','東南亞也有一模一樣的玉礦'],a:1,no:{0:'沒有證據說是偷的，交換和貿易更有可能。',2:'這些飾品出現在史前遺址裡，所以是史前時代就過去的。',3:'科學家檢查過成分，確定來自臺灣花蓮的豐田一帶。'},why:'臺灣的玉（產自花蓮豐田一帶）出現在東南亞的史前遺址，證明史前時代的人就會<b>跨海交流</b>，只是航海技術有限，多半是區域性的。'}],
 site:{look:'找一件陶器，觀察它的表面。',q:'你看到的陶器表面有花紋嗎？',o:['有花紋','沒有花紋','兩種都有'],why:'這題沒有標準答案。不同文化、不同用途的陶器，花紋都不一樣。把你看到的畫下來吧！'},
 more:[['史前生存大冒險：新石器時代','prehistory.html'],['尋根探源話臺灣','unit3.html']]},
{id:'s3',tease:'十三行的煉鐵和珠子',zone:'最初的抵岸',sub:'鐵器時代：人群的再到來？或文化變革？',url:NM+'e228dd3b-e6fd-442b-afed-214800ac802a',tour:TOUR1,c:'#0072B2',ico:'bead',stamp:'鐵',unit:'第三單元 3-1',
 intro:'大約兩千多年前，臺灣進入鐵器時代。新北市八里的十三行遺址，留下了很多線索。',
 steps:[
 {t:'choice',ev:['煉鐵爐的遺跡','鐵渣','玻璃珠、瑪瑙珠','中國古代的銅錢'],q:'十三行遺址找到了上面這些東西。從這些證據可以知道，十三行的人做了哪兩件事？',o:['自己煉鐵，也和島外的人交換東西','只會用石器，不會用鐵','從外國搬來一座城堡','種植稻米，賣給荷蘭人'],a:0,no:{1:'有煉鐵爐和鐵渣，表示他們會煉鐵。',2:'城堡是很久以後的事。',3:'荷蘭人要再過一千多年才來。'},why:'煉鐵爐和鐵渣說明他們<b>自己煉鐵</b>；玻璃珠、瑪瑙珠和銅錢不是臺灣做的，說明他們和<b>島外的人交換東西</b>。'},
 {t:'sort',q:'把這三樣工具，依照出現的時代排好（最早的在最上面）。',items:['打製石器','磨製石器','鐵斧'],why:'打製石器（舊石器時代）→ 磨製石器（新石器時代）→ 鐵器（鐵器時代）。新的技術常常是在舊技術的基礎上發展出來的，這就是「技術會延續」。'},
 {t:'choice',q:'這個展區的名字叫「鐵器時代：人群的再到來？或文化變革？」為什麼要打兩個問號？',o:['因為展覽還沒做完','因為學者有不同的看法：可能是新的人群來了，也可能是原本的人學會新技術、和海外貿易，自己改變了','因為鐵器時代根本不存在','因為問號比較好看'],a:1,no:{0:'展覽已經完成了，問號是故意的。',2:'十三行的煉鐵爐就是鐵器時代的證據。',3:'展區名稱的每個符號都有意思喔。'},why:'博物館的說明提到兩種看法：一種認為是新的移民帶來鐵器；另一種認為還是原本的人群，只是引進、發明了新技術，又和海外貿易，文化因此改變。<b>問號代表還在研究中</b>。'}],
 site:{look:'在展區裡找找看鐵器時代留下的東西。',q:'你找到了哪些？（可以選很多個）',multi:1,o:['珠子','鐵器','煉鐵留下的東西','陶器','我都沒找到'],why:'把你最喜歡的一件記下來：它是什麼？可能拿來做什麼？'},
 more:[['史前生存大冒險：金屬器時代','prehistory.html']]},
{id:'s4',tease:'臺灣登上世界舞臺',zone:'倚海而生的島與人',sub:'世界航線，集結！',url:NM+'16d5e9ed-c29c-45bf-af96-502057ed41a5',tour:TOUR2,c:'#56B4E9',ink:'#1d6f9e',ico:'ship',stamp:'航',unit:'第四單元 4-1',
 intro:'16 世紀中期以後，歐洲人開闢了到亞洲的新航路。臺灣慢慢成為東亞貿易的會合點和轉運點，東方和西方的海上強權都來這裡競爭。',
 steps:[
 {t:'choice',q:'葡萄牙水手經過臺灣時，稱它為「Formosa」。這個字是什麼意思？',o:['美麗的島','有很多鹿的地方','颱風很多的島','東方的港口'],a:0,no:{1:'臺灣以前確實有很多梅花鹿，但 Formosa 不是這個意思。',2:'颱風很多是真的，但不是這個字的意思。',3:'不是喔，再想想水手看到臺灣時的感覺。'},why:'Formosa 是「美麗的」的意思，後來西方人就用「福爾摩沙」稱呼臺灣。'},
 {t:'choice',q:'大航海時代，為什麼臺灣會成為各國船隻的會合點？',o:['因為臺灣最大','因為臺灣在東亞南北航線的中間，往來中國、日本、東南亞都很方便','因為臺灣沒有颱風','因為只有臺灣有港口'],a:1,no:{0:'臺灣不是最大的島。',2:'臺灣颱風不少喔。',3:'中國、日本、東南亞都有很多港口。'},why:'臺灣位在亞洲東部南北往來的必經之地，可以當作<b>轉運站</b>：把中國的貨物轉賣到日本或歐洲。今天的高雄港也是全球重要的貨櫃港。'},
 {t:'match',q:'這些貨物主要從哪裡來？幫每一樣找到來源。',L:['生絲、瓷器','鹿皮','白銀','香料'],R:['中國','臺灣','日本','東南亞'],a:[0,1,2,3],why:'商人在臺灣交易來自各地的貨物：中國的生絲和瓷器、臺灣的鹿皮、日本的白銀、東南亞的香料。臺灣就像一個<b>交會的十字路口</b>。'}],
 site:{look:'找一張古地圖，看看上面的臺灣。',q:'古地圖上的臺灣，和今天的地圖比起來怎麼樣？',o:['很像','形狀不太一樣','畫成好幾個島','找不到臺灣'],why:'這題沒有標準答案。早期的地圖是航海的人一邊航行一邊畫的，常常和實際不太一樣。說說看你發現了什麼？'},
 more:[['大航海時代的臺灣','unit4.html']]},
{id:'s5',tease:'荷蘭人、西班牙人、漢人、日本人',zone:'倚海而生的島與人',sub:'登上臺灣的各國人士',url:NM+'b7b0bad8-88e5-4e54-a3f2-7253a53e3c52',tour:TOUR2,c:'#D55E00',ico:'fort',stamp:'城',unit:'第四單元 4-2',
 intro:'中國和日本的私商、海盜，最早把臺灣當成會合貿易的地方。17 世紀，歐洲的荷蘭人和西班牙人也來了，在臺灣蓋起城堡。',
 steps:[
 {t:'map',q:'把三座城堡放到地圖上正確的位置。先點城堡的名字，再點地圖。',pins:['zl','sv','sd'],why:'荷蘭人 1624 年在今臺南安平一帶登陸，蓋了<b>熱蘭遮城</b>；西班牙人 1626 年到北部雞籠（基隆）的社寮島（和平島）蓋<b>聖薩爾瓦多城</b>，又在淡水蓋<b>聖多明哥城</b>（後來重建成今天的紅毛城）。'},
 {t:'match',q:'這些人來到臺灣，主要做了什麼？',L:['荷蘭人','西班牙人','漢人','日本人'],R:['在臺南蓋熱蘭遮城，把臺灣當成和中國、日本貿易的轉運站','在雞籠、淡水蓋城堡，也傳播天主教','被招募來開墾，種稻米和甘蔗','到臺灣做生意的商人'],a:[0,1,2,3],why:'荷蘭人和西班牙人都想把臺灣當成貿易據點；荷蘭人從中國招募漢人來開墾，種稻米和甘蔗、輸出蔗糖；日本商人也常來臺灣交易。'},
 {t:'choice',q:'西元 1642 年，荷蘭人派兵北上，把西班牙人趕走。為什麼？',o:['想獨占臺灣的經濟利益','西班牙人先攻打臺南','因為北部天氣比較好','為了保護原住民'],a:0,no:{1:'課本裡沒有這件事，是荷蘭人主動北上的。',2:'天氣不是打仗的原因。',3:'荷蘭人主要是為了自己的利益。'},why:'荷蘭人想<b>獨占臺灣的經濟利益</b>，所以派兵北上，把西班牙人趕走，勢力擴張到臺灣北部。'}],
 site:{look:'在展區裡找找看：有沒有不同國家的人的畫像、模型或物品？',q:'你看到了哪些人的東西？（可以選很多個）',multi:1,o:['荷蘭人','西班牙人','漢人','日本人','原住民'],why:'選一個人，想像他為什麼要冒險渡海來到臺灣，寫下來。'},

{id:'s6',tease:'鹿皮、羅馬字和部落的選擇',zone:'倚海而生的島與人',sub:'身陷角力戰的原住民',url:NM+'8f3c6c0d-2d5e-40f3-bccc-209c5e025c85',tour:TOUR2,c:'#CC79A7',ink:'#a1467a',ico:'deer',stamp:'鹿',unit:'第四單元 4-3',
 intro:'漢人、日本人、荷蘭人、西班牙人相繼到來，原本相對穩定的原住民族社會，受到很大的影響。',
 steps:[
 {t:'sort',q:'一張鹿皮的旅行：把事情依照發生的順序排好。',items:['原住民在平原上獵捕梅花鹿','原住民用鹿皮和荷蘭人交換日常用品','荷蘭人把鹿皮運到日本賣','日本用鹿皮做盔甲內襯、衣物','臺灣的梅花鹿越來越少'],why:'鹿皮在日本很搶手，荷蘭人大量收購、外銷，賺了很多錢；但是捕得太多，臺灣西部平原上成千上萬的梅花鹿越來越少。'},
 {t:'choice',q:'荷蘭人教原住民用羅馬字母拼寫自己的語言。後來，原住民用這種文字做了什麼？',o:['和漢人簽訂土地契約，這種文字到清朝還在使用','寫信給荷蘭國王','做成路標給觀光客看','只在學校考試時用'],a:0,no:{1:'沒有這樣的紀錄。',2:'那時候還沒有觀光客喔。',3:'不只在學校，生活中也用得到。'},why:'荷蘭人為了傳教，用羅馬字母拼寫原住民語言；原住民後來用這種文字和漢人簽土地契約，一直用到清帝國時期。這些契約常被稱為「新港文書」。'},
 {t:'choice',q:'外來的人越來越多，原住民只能被動接受嗎？',o:['是，原住民只能聽外來者的','不是，各部落會選擇對自己有利的同盟，也會和敵對的勢力衝突','不是，原住民全部都搬到外國去了','是，因為原住民沒有自己的想法'],a:1,no:{0:'博物館說，原住民會「主動選擇」同盟對象。',2:'沒有這樣的事。',3:'每個部落都有自己的盤算。'},why:'博物館的說明寫著：面對外來者，原住民各部落會<b>主動選擇</b>有利於部落的同盟對象，也會和敵對的勢力發生衝突。不同族群之間，有時交惡、有時結盟。'}],
 site:{look:'在展區裡找找看和原住民有關的展品。',q:'你找到了什麼？（可以選很多個）',multi:1,o:['用羅馬字寫的文件','鹿或鹿皮','原住民的器物','地圖','我都沒找到'],why:'選一件，寫下它告訴我們原住民當時過著什麼樣的生活。'},

{id:'s7',tease:'荷蘭 → 鄭氏 → 清朝',zone:'倚海而生的島與人',sub:'從海到陸的政權轉折',url:NM+'2e9720d1-9615-4823-8ebb-2b3199f31163',tour:TOUR2,c:'#5E5E5E',ico:'scroll',stamp:'鄭',unit:'第四單元 4-2、4-3',
 intro:'1662 年以後，鄭氏取代荷蘭政權，仍然把海上貿易當成生存的根本。後來清朝取代鄭氏，臺灣從開放的海洋貿易據點，變成中華帝國邊陲的一個府。',
 steps:[

  <div class="qs-row"><button class="qs-btn" id="qsPrint" ${n<7?'disabled':''}>${n<7?`集滿 7 個才能印證書（還差 ${7-n} 個）`:'印出證書'}</button><button class="qs-btn alt" id="qsReset">重新開始</button></div>`;
 const notes=ST.filter(s=>S.notes[s.id]&&(S.notes[s.id].text||S.notes[s.id].look));const d=new Date();
 $('#qsCert').innerHTML=`<h2>臺史博尋寶任務 完成證書</h2><p style="text-align:center;font-size:16pt"><b>${esc(S.name||'尋寶小隊員')}</b> 完成了「斯土斯民：臺灣的故事」7 個展區的任務，共獲得 ${tot} 顆星。</p><div class="qs-pass">${ring}</div>
  ${notes.length?`<h3>我的現場筆記</h3>${notes.map(s=>`<div class="cn"><b>${s.sub.split('：')[0]}</b>：${esc([S.notes[s.id].look&&('看到：'+S.notes[s.id].look),S.notes[s.id].text].filter(Boolean).join('。'))}</div>`).join('')}`:''}
  <p style="text-align:right;margin-top:10mm">${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日・海佃地圖</p>`;
 $('#qsPrint').onclick=()=>window.print();
 $('#qsReset').onclick=()=>{if(!confirm('要清除所有印章和筆記，重新開始嗎？'))return;S={name:S.name,mode:S.mode,st:{},notes:{},timer:S.timer};save();route();};}
/* ---------- teacher key ---------- */
function teacher(){const ans=st=>st.t==='choice'?st.o[st.a]:st.t==='sort'?st.items.map((t,i)=>t+(st.years?`（${st.years[i]}）`:'')).join(' → '):st.t==='match'?st.L.map((l,i)=>`${l}－${st.R[st.a[i]]}`).join('；'):st.t==='map'?st.pins.map(p=>LOC[p][0]).join('、'):'';
 $('#qsTeacher').innerHTML=`<p>每一站 3 題，題型有：看證據推理、排順序、配對、在地圖上找位置。答錯可以重試，系統會依答錯次數給 1～3 顆星。學生的進度存在自己的瀏覽器裡，不會上傳。</p>
 <p><b>博物館現場模式</b>：每一站多兩個步驟：先找到展區、觀察實物並勾選看到的東西，最後寫一句現場筆記。觀察題多半沒有標準答案，筆記會印在證書上。臺史博的展品會調整，題目只用到展區名稱和一般性的觀察，不依賴特定展板上的文字。</p>
 <p><b>沒辦法去現場</b>：每一站都附臺史博官方的線上 3D 展廳（Matterport）和展區介紹連結。</p>
 <details class="qs-teacher"><summary>題目與答案</summary><ol>${ST.map(s=>`<li><b>${s.sub}</b>（${s.unit}）<ol>${s.steps.map(st=>`<li>${st.q.replace(/<[^>]+>/g,'')}<br><span class="ans">答案：${ans(st)}</span></li>`).join('')}</ol></li>`).join('')}</ol></details>`;}
route();teacher();
window.__qs={open,route,S:()=>S};
})();
</script>
