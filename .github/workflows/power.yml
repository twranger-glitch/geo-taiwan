name: 更新台電即時發電資料

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分鐘（GitHub 可能延遲幾分鐘）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: power
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: 取出資料分支
        run: |
          git clone --depth 1 --branch power-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data || {
            mkdir data && cd data && git init -q -b power-data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取台電開放資料
        working-directory: data
        run: python ../src/scripts/fetch_power.py
      - name: 更新資料分支（只保留一個提交，避免歷史變大）
        working-directory: data
        run: |
          git config user.name "power-bot"
          git config user.email "power-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "台電即時發電資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" --allow-empty
          git reset -q --soft $(git commit-tree HEAD^{tree} -m "台電即時發電資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')")
          git push -q -f origin HEAD:power-data
