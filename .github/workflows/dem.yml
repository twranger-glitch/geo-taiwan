name: 建立海平面模擬地形資料

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe 或 build"
        default: "probe"

permissions:
  contents: write

jobs:
  dem:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        if: inputs.mode == 'build'
        run: pip install numpy rasterio pillow netCDF4 scipy
      - name: 探測資料來源
        if: inputs.mode == 'probe'
        run: python scripts/probe_dem.py
      - name: 建立地形資料
        if: inputs.mode == 'build'
        run: python scripts/build_dem.py
      - name: 提交
        run: |
          git config user.name "dem-bot"
          git config user.email "dem-bot@users.noreply.github.com"
          git add data/sealevel
          if git diff --cached --quiet; then echo "沒有變動"; else
            git commit -m "更新海平面模擬地形資料 (${{ inputs.mode }})"
            git pull --rebase origin main
            git push
          fi
