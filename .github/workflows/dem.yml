name: 建立海平面模擬地形資料

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe 或 build"
        default: "build"

permissions:
  contents: write

jobs:
  dem:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        if: inputs.mode == 'build' || inputs.mode == 'tiles'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gmt gmt-gshhg-full
          pip install numpy rasterio pillow netCDF4 scipy numba
      - name: 建立放大用的細緻圖塊
        if: inputs.mode == 'tiles'
        run: |
          mkdir -p data/sealevel
          python scripts/build_tiles.py 2>&1 | tee data/sealevel/_tiles.log || true
      - name: 建立地形資料
        if: inputs.mode == 'build'
        run: |
          mkdir -p data/sealevel
          PARTS="tw tn" python scripts/build_dem.py 2>&1 | tee data/sealevel/_build.log || true
      - name: 提交
        run: |
          git config user.name "dem-bot"
          git config user.email "dem-bot@users.noreply.github.com"
          git add data/sealevel
          if git diff --cached --quiet; then echo "沒有變動"; else
            git commit -m "更新海平面模擬地形資料 (${{ inputs.mode }})"
            git pull --rebase origin main
            git push
          fi
