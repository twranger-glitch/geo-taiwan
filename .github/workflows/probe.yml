name: 探測資料網址
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "空白分隔的網址"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py ${{ inputs.urls }}
      - run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add data/_probe; git commit -qm "probe" && git pull -q --rebase origin main && git push -q
