name: 更新水庫蓄水資料

on:
  schedule:
    - cron: "23 */2 * * *"   # 每兩小時一次（UTC 時間第 23 分）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reservoirs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取水利署開放資料
        run: python scripts/fetch_reservoirs.py
      - name: 有變動才提交
        run: |
          git config user.name "reservoir-bot"
          git config user.email "reservoir-bot@users.noreply.github.com"
          git add data/reservoirs
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "更新水庫蓄水資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
