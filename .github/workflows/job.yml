name: 一次性資料工作
on:
  push:
    branches: [main]
    paths: [scripts/job.py]
permissions:
  contents: write
jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy pillow
      - run: python scripts/job.py
      - run: |
          git config user.name "job-bot"; git config user.email "job-bot@users.noreply.github.com"
          git add data/_job; git commit -qm "data job" && git pull -q --rebase origin main && git push -q
